name: Community pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Python pipeline contracts
        shell: pwsh
        run: |
          $failedExitCode = 0
          foreach ($pattern in @('test_a10_benchmark.py', 'test_a5_batch.py', 'test_community_pipeline.py')) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Get-Command python -ErrorAction Stop).Source
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $startInfo.StandardErrorEncoding = [System.Text.UTF8Encoding]::new($false)
            $startInfo.Environment['PYTHONUTF8'] = '1'
            foreach ($argument in @('-X', 'utf8', '-m', 'unittest', 'discover', '-s', 'tests', '-p', $pattern, '-v')) {
              [void]$startInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            Write-Output "python -X utf8 -m unittest discover -s tests -p $pattern -v"
            Write-Output $stdout
            Write-Output $stderr
            if ($process.ExitCode -ne 0) {
              $message = "Exit code: $($process.ExitCode)`nSTDOUT:`n$stdout`nSTDERR:`n$stderr"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Python pipeline contracts ($pattern)::$message"
              if ($failedExitCode -eq 0) { $failedExitCode = $process.ExitCode }
            }
            $process.Dispose()
          }
          if ($failedExitCode -ne 0) { exit $failedExitCode }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          foreach ($file in Get-ChildItem scripts -Filter *.ps1 -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $failures += $errors }
          }
          if ($failures) { $failures | Format-List; exit 1 }
      - name: Native verification boundary
        shell: pwsh
        run: Write-Output 'This job checks tooling only. Full Release/type-load/kernel verification and Steam benchmarks require a local legal game installation; see docs/TESTING_AND_BENCHMARKS.md.'
